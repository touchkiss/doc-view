import org.jetbrains.changelog.Changelog
import org.jetbrains.changelog.ChangelogSectionUrlBuilder
import org.jetbrains.changelog.ExtensionsKt

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.17.0'
    id 'org.jetbrains.changelog' version '2.1.2'
}

group = project.pluginGroup
version = project.pluginVersion

def localIde = file('/Applications/IntelliJ IDEA.app')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    maven { url "https://maven.aliyun.com/repository/public" }
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'

    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.42'
    compileOnly group: 'org.commonmark', name: 'commonmark', version: '0.29.0'
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.5.0'
    implementation('io.modelcontextprotocol.sdk:mcp-core:2.0.0') {
        exclude group: 'jakarta.servlet', module: 'jakarta.servlet-api'
    }
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3:2.0.0'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.42'
    testCompileOnly group: 'io.swagger.core.v3', name: 'swagger-annotations', version: '2.2.54'

    intellijPlatform {
        local(localIde)

        bundledPlugin('com.intellij.java')
        bundledPlugin('org.intellij.plugins.markdown')
        // JCEF 在 2026.2 拆分为独立捆绑插件（含 module intellij.platform.ui.jcef），
        // 提供 com.intellij.ui.jcef.JBCefApp / JBCefBrowser
        bundledPlugin('com.intellij.modules.jcef')
        // Protocol Buffers 插件，提供 com.intellij.protobuf.lang.psi.* (PbFile/PbMessageType/PbField)
        // 用于解析 .proto 中的 message 结构；plugin.xml 中声明为 optional depends
        bundledPlugin('idea.plugin.protoeditor')
    }
}

sourceSets {
    constantValueTest {
        java.srcDir 'src/constantValueTest/java'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath + tasks.compileJava.classpath
        runtimeClasspath += output + compileClasspath
    }
    contentUsingTest {
        java.srcDir 'src/contentUsingTest/java'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath + tasks.compileJava.classpath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    constantValueTestImplementation.extendsFrom testImplementation
    constantValueTestRuntimeOnly.extendsFrom testRuntimeOnly
    contentUsingTestImplementation.extendsFrom testImplementation
    contentUsingTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('constantValueTest', Test) {
    description = 'Runs Java constant resolution regression tests with real PSI.'
    group = 'verification'
    testClassesDirs = sourceSets.constantValueTest.output.classesDirs
    classpath = sourceSets.constantValueTest.runtimeClasspath
    // Core PSI reads compiled class files through the IDE's NIO filesystem.
    classpath += files(new File(localIde, 'Contents/lib/nio-fs.jar'))
    useJUnit()
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
    jvmArgs '--add-exports=java.base/sun.nio.fs=ALL-UNNAMED'
}

tasks.register('contentUsingTest', Test) {
    description = 'Runs JsonDeserialize contentUsing regression tests.'
    group = 'verification'
    testClassesDirs = sourceSets.contentUsingTest.output.classesDirs
    classpath = sourceSets.contentUsingTest.runtimeClasspath
    useJUnit()
}

intellijPlatform {
    pluginConfiguration {
        name = project.pluginName

        ideaVersion {
            sinceBuild = project.pluginSinceBuild
            untilBuild = project.pluginUntilBuild
        }

        description = file(project.pluginDescription).getText('UTF-8')

        changeNotes = provider {
            changelog.renderItem(
                    changelog.getLatest(),
                    Changelog.OutputType.HTML
            )
        }
    }

    buildSearchableOptions = false
}

changelog {
    path = file("CHANGELOG.md").canonicalPath
    header = "[${-> version.get()}] - ${ExtensionsKt.date("yyyy-MM-dd")}"
    keepUnreleasedSection = true
    unreleasedTerm = "[Unreleased]"
    groups = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
    lineSeparator = "\n"
    combinePreReleases = true
    sectionUrlBuilder = { repositoryUrl, currentVersion, previousVersion, isUnreleased -> "foo" } as ChangelogSectionUrlBuilder
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}
